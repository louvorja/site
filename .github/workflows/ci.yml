name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: CI / Validação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar ganchos de instalação
        run: node --test tests/install-policy.test.mjs
      - name: Instalar dependências sem ganchos
        run: npm ci --ignore-scripts --no-audit
      - name: Validar build do site
        run: npm --ignore-scripts run build
        env:
          NODE_ENV: production
          VITE_BASE_URL: /
